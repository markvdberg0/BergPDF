[package]
name = "printing"
description = "Printing: the list of printers and sending a PDF's pages to one (GDI on Windows, CUPS `lp` elsewhere)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pdf-engine.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
] }

[dev-dependencies]
test-support.workspace = true
tempfile.workspace = true

# Not `workspace = true`: the Windows printing code calls the GDI printing API and needs `unsafe`. It is allowed
# in exactly one module (`src/windows.rs`); everywhere else in this crate it is denied, and the rest of the
# workspace forbids it.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
