[package]
name = "pdf-ocr"
description = "Offline text recognition (OCR) for page images, built on the pure-Rust ocrs/rten engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ocrs = "0.13"
# `onnx_format`: the Latin recognition model is an ONNX file (read by rten's own pure-Rust parser).
rten = { version = "0.26", features = ["onnx_format"] }
rten-imageproc = "0.26"
rten-tensor = "0.26"
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
png = "0.18"
