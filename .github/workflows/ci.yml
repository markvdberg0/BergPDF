# Quality gate on the three first-class build targets: format, clippy, tests, licence check.
# It builds no installers and publishes nothing; installers come from release.yml (tags or a
# manual run).
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore"]

# A newer push to the same branch replaces a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64 (msvc), os: windows-latest }
          - { name: macos-aarch64, os: macos-14 }
          - { name: linux-x86_64, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Require independent oracles on runners where they are installed
        if: runner.os != 'Windows'
        shell: bash
        run: echo "BERG_REQUIRE_ORACLES=1" >> "$GITHUB_ENV"
      - name: Linux system packages (headless render checks use poppler as an oracle)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: macOS oracle tools
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: OCR models (explicit download, checksum-verified; Linux job is the one that requires them)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo xtask fetch-ocr-models "$RUNNER_TEMP/ocr-models"
          echo "BERG_OCR_MODELS=$RUNNER_TEMP/ocr-models" >> "$GITHUB_ENV"
          echo "BERG_REQUIRE_OCR=1" >> "$GITHUB_ENV"
      - name: veraPDF (independent PDF/A validator for the tests; Linux job requires it)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y default-jre-headless maven
          mkdir -p "$RUNNER_TEMP/verapdf" && cd "$RUNNER_TEMP/verapdf"
          printf '<project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>local</groupId><artifactId>vera-fetch</artifactId><version>1</version><dependencies><dependency><groupId>org.verapdf.apps</groupId><artifactId>greenfield-apps</artifactId><version>1.28.2</version></dependency></dependencies></project>' > pom.xml
          mvn -q -B dependency:copy-dependencies -DoutputDirectory=lib
          echo "BERG_VERAPDF=$RUNNER_TEMP/verapdf/lib" >> "$GITHUB_ENV"
          echo "BERG_REQUIRE_VERAPDF=1" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
