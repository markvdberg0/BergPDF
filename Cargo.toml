[workspace]
resolver = "3"
members = [
    "crates/ai-client",
    "crates/pdf-ocr",
    "crates/pdf-sign",
    "apps/desktop",
    "crates/brand",
    "crates/editor-core",
    "crates/pdf-engine",
    "crates/platform",
    "crates/test-support",
    "xtask",
]
default-members = [
    "crates/ai-client",
    "crates/pdf-ocr",
    "crates/pdf-sign",
    "apps/desktop",
    "crates/brand",
    "crates/editor-core",
    "crates/pdf-engine",
    "crates/platform",
    "crates/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
# GNU GPL v3 or later, chosen by the repository owner (docs/DECISIONS.md D-001).
# `publish = false` keeps the crates off crates.io.
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/markvdberg0/BergPDF"
homepage = "https://github.com/markvdberg0/BergPDF"
authors = ["BergPDF contributors"]

[workspace.dependencies]
hayro = { version = "0.8", default-features = false, features = ["embed-fonts", "embed-cmaps", "simd"] }
lopdf = { version = "0.45", default-features = false }
pdf-writer = "0.15"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
proptest = "1"
tempfile = "3"

pdf-engine = { path = "crates/pdf-engine" }
editor-core = { path = "crates/editor-core" }
platform = { path = "crates/platform" }
test-support = { path = "crates/test-support" }
brand = { path = "crates/brand" }
pdf-sign = { path = "crates/pdf-sign" }
pdf-ocr = { path = "crates/pdf-ocr" }
ai-client = { path = "crates/ai-client" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

[profile.dev]
# Smaller target directory; backtraces keep file/line information.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Distribution builds (`cargo xtask dist`): same optimisation as release, symbols stripped.
[profile.dist]
inherits = "release"
strip = "symbols"

[profile.dev.package.brand]
opt-level = 3
