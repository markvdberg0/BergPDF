# Installer configuration for cargo-packager (https://github.com/crabnebula-dev/cargo-packager).
# Build the program folder first (cargo xtask dist), then:  cargo packager --release
# Windows: an NSIS installer (.exe); macOS: .dmg; Linux: .deb / AppImage. Output: dist/packages.
# See DEVELOPING.md ("Packaging", "Shipping notes") before handing the result to anyone.
name = "bergpdf"
product-name = "BergPDF"
# Reverse-domain identifier; change it to one you own before distributing.
identifier = "app.bergpdf.desktop"
version = "0.3.0"
description = "Offline PDF editor"
authors = ["BergPDF"]
out-dir = "dist/packages"
binaries-dir = "target/dist"
binaries = [{ path = "bergpdf", main = true }]
icons = ["assets/icons/bergpdf.ico", "assets/icons/bergpdf.icns", "assets/icons/bergpdf-256.png"]
license-file = "LICENSE"
resources = [
  { src = "LICENSE", target = "LICENSE" },
  { src = "README.md", target = "README.md" },
  # The icon Explorer shows for .pdf files that open with BergPDF (see packaging/windows/installer.nsi).
  { src = "assets/icons/pdf-file.ico", target = "pdf-file.ico" },
  { src = "docs/THIRD_PARTY_LICENSES.md", target = "THIRD_PARTY_LICENSES.md" },
  { src = "docs/DEPENDENCIES.md", target = "DEPENDENCIES.md" },
]

[[file-associations]]
extensions = ["pdf"]
mime-type = "application/pdf"
description = "PDF document"
role = "editor"

[nsis]
# The installer lets the user choose: just for me (no administrator rights) or all users (Program Files).
installer-mode = "both"
compression = "lzma"
# cargo-packager's own template plus one section that offers the OCR model download (see the file).
# It is a copy of the template of cargo-packager 0.11.8: install exactly that version.
template = "packaging/windows/installer.nsi"
